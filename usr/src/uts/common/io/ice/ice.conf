#
# Driver.conf file for the Intel E810 Ethernet driver (ice).
# See ice(4D) for valid options.  All tunables are commented out at their
# default; uncomment to override.
#

#
# num_queues: number of Rx/Tx data queues to allocate, rounded down to a power
# of two and clamped by the CPU count and the MSI-X vectors the platform
# grants.  Default: the driver maximum.
#
# num_queues=8;

#
# tx_lso_enable: set to 1 to advertise TCP large-send (LSO/TSO) offload.
# Default 0 (disabled) pending full segmentation validation.
#
# tx_lso_enable=0;

#
# default_mtu: the initial MTU in bytes.  The MTU is also settable at runtime
# with dladm(8).
#
# default_mtu=1500;
